name: Update ALFA DESIGN Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace preview image
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path("index.html")
          text = file.read_text(encoding="utf-8")

          old = "ALFA-BANNER.png"
          new = "LOGO-PREVIEW-ALFA.jpg"

          if old not in text:
              print("ALFA-BANNER.png tidak ditemukan.")
              raise SystemExit(0)

          updated = text.replace(old, new)
          file.write_text(updated, encoding="utf-8")

          print("Preview image berhasil diganti.")
          PY

      - name: Commit perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Set ALFA DESIGN social preview image"
          git push
