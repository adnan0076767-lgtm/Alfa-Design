name: Fix ALFA DESIGN Preview Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix OG and Twitter image
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path("index.html")
          text = file.read_text(encoding="utf-8")

          old_url = "https://adnan0076767-lgtm.github.io/Alfa-Design/ALFA-BANNER.png"
          new_url = "https://adnan0076767-lgtm.github.io/Alfa-Design/LOGO-PREVIEW-ALFA.jpg"

          count = text.count(old_url)

          print(f"Ditemukan {count} URL lama.")

          if count == 0:
              raise SystemExit("URL lama tidak ditemukan.")

          text = text.replace(old_url, new_url)

          file.write_text(text, encoding="utf-8")

          print("OG/Twitter preview berhasil diperbarui.")
          PY

      - name: Verify
        run: |
          grep -n "og:image" index.html
          grep -n "twitter:image" index.html

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          git commit -m "Fix ALFA DESIGN preview image"

          git push
